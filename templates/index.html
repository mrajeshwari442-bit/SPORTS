<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportsBot - Sports Chatbot</title>
<style>
  :root {
    --primary: #1e7d32;
    --primary-dark: #145a24;
    --bg: #f4f6f5;
    --bubble-user: #1e7d32;
    --bubble-bot: #ffffff;
    --text-dark: #1a1a1a;
    --border: #dfe3e0;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }

  .chat-container {
    width: 100%;
    max-width: 480px;
    height: 640px;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-header {
    background: var(--primary);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .chat-header .icon {
    font-size: 24px;
  }

  .chat-header h1 {
    font-size: 18px;
    margin: 0;
  }

  .chat-header p {
    margin: 0;
    font-size: 12px;
    opacity: 0.85;
  }

  .chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.4;
    font-size: 14px;
    white-space: pre-wrap;
  }

  .message.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border: 1px solid var(--border);
    color: var(--text-dark);
    border-bottom-left-radius: 4px;
  }

  .message.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .message.error {
    align-self: flex-start;
    background: #fdecea;
    color: #b3261e;
    border: 1px solid #f5c6c3;
  }

  .typing {
    align-self: flex-start;
    font-size: 13px;
    color: #777;
    padding-left: 4px;
  }

  .chat-input {
    display: flex;
    border-top: 1px solid var(--border);
    padding: 12px;
    gap: 8px;
  }

  .chat-input input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 14px;
    outline: none;
  }

  .chat-input input:focus {
    border-color: var(--primary);
  }

  .chat-input button {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 0 20px;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .chat-input button:hover {
    background: var(--primary-dark);
  }

  .chat-input button:disabled {
    background: #a5a5a5;
    cursor: not-allowed;
  }
</style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <span class="icon">🏆</span>
    <div>
      <h1>SportsBot</h1>
      <p>Your sports-only chat assistant</p>
    </div>
  </div>

  <div class="chat-messages" id="chat-messages">
    <div class="message bot">
      Hey there! I'm SportsBot 🏅 Ask me anything about sports - teams,
      players, scores, rules, or history!
    </div>
  </div>

  <div class="chat-input">
    <input type="text" id="user-input" placeholder="Ask about sports..." autocomplete="off">
    <button id="send-btn">Send</button>
  </div>
</div>

<script>
  const chatMessages = document.getElementById("chat-messages");
  const userInput = document.getElementById("user-input");
  const sendBtn = document.getElementById("send-btn");

  function addMessage(text, sender) {
    const msgDiv = document.createElement("div");
    msgDiv.classList.add("message", sender);
    msgDiv.textContent = text;
    chatMessages.appendChild(msgDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
    return msgDiv;
  }

  function addTypingIndicator() {
    const typingDiv = document.createElement("div");
    typingDiv.classList.add("typing");
    typingDiv.id = "typing-indicator";
    typingDiv.textContent = "SportsBot is typing...";
    chatMessages.appendChild(typingDiv);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function removeTypingIndicator() {
    const el = document.getElementById("typing-indicator");
    if (el) el.remove();
  }

  async function sendMessage() {
    const message = userInput.value.trim();
    if (!message) return;

    addMessage(message, "user");
    userInput.value = "";
    sendBtn.disabled = true;
    addTypingIndicator();

    try {
      const response = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: message })
      });

      const data = await response.json();
      removeTypingIndicator();

      if (response.ok) {
        addMessage(data.reply, "bot");
      } else {
        addMessage(data.error || "Something went wrong.", "error");
      }
    } catch (err) {
      removeTypingIndicator();
      addMessage("Network error. Please try again.", "error");
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  userInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      sendMessage();
    }
  });
</script>

</body>
</html>
